name: CI
run-name: >-
  ${{ (github.event_name != 'pull_request' ||
  (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
  (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) && format('{0} validation', github.workflow) || 'Deferred validation' }}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: >-
    ${{ (github.event_name != 'pull_request' ||
    (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
    (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) && format('ci-{0}-{1}-{2}', github.workflow, github.event.pull_request.number || github.ref, github.event_name) || format('deferred-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  actions: read
  pull-requests: read
  contents: read

jobs:
  # Dependabot PRs skip until a provenanced optimize-workspaces drain applies
  # `ow-ci`. Only that `labeled` event runs CI, so a later Dependabot push
  # defers again until the drain re-kicks the new head. Deferred jobs use
  # name `ci-deferred` so a skipped required `ci` check cannot look green.
  ci:
    name: >-
      ${{ (github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')) && 'ci' || 'ci-deferred' }}
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ow-ci')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Nothing but the checkout runs before the scan: an earlier step could rewrite the git config,
      # PATH, or environment the scan reads history with.
      - name: Secrets scan (range)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_arm64.tar.gz \
            --output "$tmp/gitleaks.tar.gz"
          echo "574a6d52573c61173add7ddb5e3cc68c0e82cb0735818a1eeb9a0a2de1643fbc  $tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp"
          sudo install -m 755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            range="refs/remotes/origin/main..HEAD" # a PR, or a dispatch elsewhere: all it adds to main
          else
            # Main: all since the nearest commit in this history with a green main push run, so a leak
            # keeps main red until it is dealt with. The run listing can lag, so read main's newest 100
            # push runs up to three times, until a read shows this run attempt (a dispatch is not a
            # push run, so its first successful read stands). Anchor on the last successful read
            # either way: each green run it lists scanned its own history, and this run's earlier
            # attempt is left out. Three failed reads fail the step; no green in history scans all.
            runs=""
            read_ok=""
            fresh=""
            for attempt in 1 2 3; do
              [[ "$attempt" == 1 ]] || sleep "$((attempt - 1))"
              if ! listed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" --jq '.workflow_runs[] |
                "\(.id) \(.run_attempt) \(if .head_branch == "main" and .event == "push" and .conclusion == "success" then .head_sha else "-" end)"')"; then
                echo "::warning::reading main's push runs failed (read $attempt of 3)"
                continue
              fi
              runs="$listed"
              read_ok=1
              if [[ "$GITHUB_EVENT_NAME" != push ]] || grep -q "^$GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT " <<<"$runs"; then
                fresh=1
                break
              fi
            done
            if [[ -z "$read_ok" ]]; then
              echo "::error::reading main's push runs failed three times"
              exit 1
            fi
            if [[ -z "$fresh" ]]; then
              echo "::warning::no read of main's push runs showed this run attempt, so the anchor may be older than it needs to be"
            fi
            declare -A green_runs=()
            while read -r id _ sha; do
              [[ "$id" == "$GITHUB_RUN_ID" || -z "$sha" || "$sha" == - ]] || green_runs[$sha]=1
            done <<<"$runs"
            green=""
            while read -r sha; do
              if [[ -n "${green_runs[$sha]:-}" ]]; then
                green="$sha"
                break
              fi
            done < <(git rev-list --topo-order HEAD)
            if [[ -z "$green" ]]; then
              echo "::warning::none of main's newest 100 push runs is green in this history; scanning all of it"
            fi
            range="${green:+$green..}HEAD"
          fi
          echo "Scanning $range"
          # --text reads what .gitattributes or a NUL byte would show as binary. remerge shows what a
          # two-parent merge alone introduces; a merge with more parents shows nothing. In --log-opts,
          # --no-color and --no-textconv override git config that colors the log (gitleaks then parses
          # none of it and passes) or rewrites a patch through a textconv driver. Without gitleaks' own
          # --no-color, --verbose also prints the text on either side of a redacted match.
          merges="$(git rev-list --min-parents=3 "$range")"
          if [[ -n "$merges" ]]; then
            echo "::error::$range holds a merge with three or more parents, which the scan cannot read"
            exit 1
          fi
          /usr/local/bin/gitleaks git --no-banner --no-color --redact --verbose --log-opts="--text --diff-merges=remerge --no-color --no-textconv $range"
      - name: Check for a validated PR tree
        id: verified-tree
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-verified-tree.sh
      - uses: actions/setup-node@v7
        if: steps.verified-tree.outputs.run_full != 'false'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:actions
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:md
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run test:stack-protection
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run test:infra
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:yaml
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npx --no-install playwright install --with-deps chromium
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run smoke:scenario-contract
        if: steps.verified-tree.outputs.run_full != 'false'
      - name: Astro and Svelte validation
        if: steps.verified-tree.outputs.run_full != 'false'
        run: npm run gate:app
      - name: Record validated PR tree
        if: >-
          success() && github.event_name == 'pull_request' &&
          steps.verified-tree.outputs.tree != ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-tree-v1-${{ github.job }}-${{ steps.verified-tree.outputs.tree }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tree-${{ github.job }}.txt
          if-no-files-found: error
          retention-days: 7
